name: demo_delimiter
kind: declarative
framing:
  kind: delimiter
  delim: [13, 10]     # \r\n
  include_delim: true
  max_message: 4096
fields:
  name: line
  fields:
    - name: line
      type: utf8
      offset: 0
      size: remaining
constraints: []
semantics:
  fields:
    line:
      meaning: "HTTP-строка с завершающим CRLF"