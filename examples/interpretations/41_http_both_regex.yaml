name: http_both
kind: declarative
framing:
  kind: regex
  pattern: "^(GET|POST|PUT|DELETE|HEAD|OPTIONS) [^\\r\\n]+ HTTP/1\\.[01]\\r\\n|^HTTP/1\\.[01] [0-9]{3} [^\\r\\n]+\\r\\n"
  include_match: true
  max_message: 8192
fields:
  name: http
  fields:
    - name: raw_line
      type: utf8
      offset: 0
      size: remaining
constraints: []
semantics:
  fields:
    raw_line:
      meaning: "Первая строка HTTP (запрос или ответ)"