[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "taptuna-core"
version = "0.1.0"
description = "TapTuna native core: wire, reassembly, framing, extract, safe-eval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ILOSman" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "flask>=3.0",
    "markdown>=3.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
taptuna = "taptuna.cli:main"

[project.urls]
Repository = "https://github.com/ILOSman/temp"

[tool.maturin]
python-source = "python"
module-name = "taptuna._native"
manifest-path = "Cargo.toml"
bindings = "pyo3"
strip = true