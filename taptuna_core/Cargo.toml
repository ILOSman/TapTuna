[package]
name = "taptuna_core"
version = "0.1.0"
edition = "2021"
description = "Native core for TapTuna: wire parsing, framing, field extraction, safe eval, reassembly"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
thiserror = "1"
sha2 = "0.10"
regex = "1"
once_cell = "1"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "memory_sessions"
harness = false

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("gil-refs"))'] }