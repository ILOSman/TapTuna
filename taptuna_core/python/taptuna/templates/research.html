{% extends "base.html" %}
{% block title %}Исследование{% endblock %}
{% block content %}

<h1>Исследование</h1>

<section class="card">
  <div class="row">
    <label>Сессия:</label>
    <select id="session-select" style="min-width:350px">
      <option value="">— выберите —</option>
      {% for s in sessions %}
      <option value="{{ s.id }}">
        #{{ s.id }}  {{ s.ip_src }}:{{ s.port_src }} ↔ {{ s.ip_dst }}:{{ s.port_dst }}
        (stream {{ s.stream_index }})
      </option>
      {% endfor %}
    </select>
    <button id="load-btn" class="primary">Загрузить</button>
  </div>
</section>

<section class="card" id="search-card" hidden>
  <div class="row">
    <label>Поиск:</label>
    <input type="text" id="search-text" placeholder="hex: 48656c6c6f  |  regex: Hello.+" style="width:300px">
    <label class="row small">
      <input type="checkbox" id="search-regex"> Regex
    </label>
    <button id="search-btn">Найти</button>
    <span id="search-info" class="muted small"></span>
  </div>
</section>

<section class="row" id="streams-row" hidden style="gap:1rem; align-items:flex-start">
  <div class="card" style="flex:1; min-width:0">
    <div class="row">
      <h2 style="margin:0">a_to_b</h2>
      <span class="spacer"></span>
      <span class="muted small" id="size-a">—</span>
    </div>
    <div id="hex-a" style="height:600px"></div>
  </div>
  <div class="card" style="flex:1; min-width:0">
    <div class="row">
      <h2 style="margin:0">b_to_a</h2>
      <span class="spacer"></span>
      <span class="muted small" id="size-b">—</span>
    </div>
    <div id="hex-b" style="height:600px"></div>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script>
(function () {
  const sel = document.getElementById("session-select");
  const loadBtn = document.getElementById("load-btn");
  const searchCard = document.getElementById("search-card");
  const searchText = document.getElementById("search-text");
  const searchRegex = document.getElementById("search-regex");
  const searchBtn = document.getElementById("search-btn");
  const searchInfo = document.getElementById("search-info");
  const streamsRow = document.getElementById("streams-row");

  let current = null;   // {sessionId, dirs, viewers: {a_to_b, b_to_a}}

  async function loadSession() {
    const id = sel.value;
    if (!id) return;
    streamsRow.hidden = false;
    searchCard.hidden = false;

    const meta = await window.taptuna.api("GET",
      "/api/sessions/" + id + "?project_id={{ project_name }}");
    const dirs = {};
    for (const d of (meta.directions || [])) dirs[d.direction] = d;

    current = { sessionId: id, dirs, viewers: {} };

    for (const dir of ["a_to_b", "b_to_a"]) {
      const el = document.getElementById(dir === "a_to_b" ? "hex-a" : "hex-b");
      const sizeEl = document.getElementById(dir === "a_to_b" ? "size-a" : "size-b");
      el.innerHTML = "";
      const d = dirs[dir];
      if (!d) {
        el.innerHTML = '<p class="muted" style="padding:1rem">(нет направления)</p>';
        sizeEl.textContent = "—";
        continue;
      }
      if (d.reassembled_bytes === 0) {
        el.innerHTML =
          '<p class="muted" style="padding:1rem">Поток пуст (нет payload).</p>';
        sizeEl.textContent = "0 байт";
        continue;
      }
      sizeEl.textContent = d.reassembled_bytes + " байт";
      const marks = [];
      for (const g of (d.gaps || [])) marks.push({start: g.offset, end: g.offset + g.length, kind: "gap"});
      for (const a of (d.ambiguities || [])) marks.push({start: a.offset, end: a.offset + a.length, kind: "amb"});

      const viewer = new window.taptuna.HexViewer(el, {
        sessionId: id,
        direction: dir,
        projectId: "{{ project_name }}",
        size: d.reassembled_bytes,
        marks: marks,
      });
      current.viewers[dir] = viewer;
    }
  }

  async function search() {
    if (!current) return;
    const query = searchText.value.trim();
    if (!query) { searchInfo.textContent = ""; return; }

    let parser;
    if (searchRegex.checked) {
      try { parser = { kind: "regex", re: new RegExp(query, "g") }; }
      catch (e) { searchInfo.textContent = "regex: " + e.message; return; }
    } else if (/^[0-9a-fA-F\s]+$/.test(query) && query.replace(/\s/g, "").length % 2 === 0) {
      const clean = query.replace(/\s/g, "");
      const bytes = [];
      for (let i = 0; i < clean.length; i += 2) bytes.push(parseInt(clean.slice(i, i + 2), 16));
      parser = { kind: "bytes", value: new Uint8Array(bytes) };
    } else {
      parser = { kind: "text", value: query };
    }

    let total = 0;
    for (const dir of ["a_to_b", "b_to_a"]) {
      const viewer = current.viewers[dir];
      if (!viewer) continue;
      // Загружаем весь поток целиком в память (только для поиска).
      // Для очень больших потоков можно ограничить.
      const size = viewer.size;
      if (size === 0) continue;
      let data;
      try {
        const r = await fetch(
          "/api/sessions/" + current.sessionId + "/stream/" + dir +
          "/bytes?project_id={{ project_name }}&offset=0&length=" + size
        );
        data = new Uint8Array(await r.arrayBuffer());
      } catch (e) { continue; }

      const ranges = [];
      if (parser.kind === "bytes") {
        outer: for (let i = 0; i <= data.length - parser.value.length; i++) {
          for (let j = 0; j < parser.value.length; j++) {
            if (data[i + j] !== parser.value[j]) continue outer;
          }
          ranges.push([i, i + parser.value.length]);
        }
      } else {
        let s = "";
        for (let i = 0; i < data.length; i++) s += String.fromCharCode(data[i]);
        if (parser.kind === "regex") {
          let m;
          const re = parser.re;
          while ((m = re.exec(s)) !== null) {
            ranges.push([m.index, m.index + m[0].length]);
            if (re.lastIndex === m.index) re.lastIndex++;
          }
        } else {
          let idx = 0;
          while ((idx = s.indexOf(parser.value, idx)) !== -1) {
            ranges.push([idx, idx + parser.value.length]);
            idx += 1;
          }
        }
      }
      viewer.setMarks(ranges.map(([a, b]) => ({start: a, end: b, kind: "hit"})));
      total += ranges.length;
    }
    searchInfo.textContent = "найдено: " + total;
  }

  loadBtn.addEventListener("click", loadSession);
  searchBtn.addEventListener("click", search);
  searchText.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
})();
</script>
{% endblock %}
