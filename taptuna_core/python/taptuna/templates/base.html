<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TapTuna{% endblock %} — {{ project_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="{{ url_for('ui.index') }}">TapTuna</a>
    <span class="project-name">{{ project_name }}</span>
  </div>
  <nav>
    <a href="{{ url_for('ui.index') }}">Главная</a>
    <a href="{{ url_for('ui.sessions') }}">Сессии</a>
    <a href="{{ url_for('ui.research') }}">Исследование</a>
    <a href="{{ url_for('ui.interpretations') }}">Интерпретации</a>
    <a href="{{ url_for('ui.verification') }}">Проверка</a>
    <a href="{{ url_for('ui.action_log') }}">Журнал</a>
    <a href="{{ url_for('ui.report') }}">Отчёт</a>
    <a href="{{ url_for('ui.project') }}">Проект</a>
  </nav>
</header>

<main id="main">
  {% block content %}{% endblock %}
</main>

<!-- Глобальный оверлей задач: SSE-прогресс -->
<aside id="jobs-panel" hidden>
  <header>
    <strong>Задачи</strong>
    <button type="button" id="jobs-close">×</button>
  </header>
  <div id="jobs-list"></div>
</aside>

<div id="toast-root"></div>

<script src="{{ url_for('static', filename='sse.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
