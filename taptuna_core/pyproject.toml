[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "taptuna-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "markdown>=3.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[tool.maturin]
python-source = "python"
module-name = "taptuna._native"
manifest-path = "Cargo.toml"
bindings = "pyo3"

[project.scripts]
taptuna = "taptuna.cli:main"